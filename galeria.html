      <div class="lightbox" id="lightbox">

    <!-- ===== WIDGET FIXO: disco / vídeo em loop ===== -->
    <div class="vinyl-widget" id="vinylWidget">
      <div class="vinyl-ring"></div>
      <div
        class="vinyl-video-mask"
        id="vinylToggle"
        role="button"
        tabindex="0"
        aria-label="Pausar ou tocar prévia"
      >
        <video
          class="vinyl-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster=""
        >
          <source src="img/hero-loop.mp4" type="video/mp4" />
        </video>
        <div class="vinyl-label">
          <span>DJ</span>
          <span>AUTUMN</span>
        </div>
      </div>
      <div class="tonearm"></div>
      <span class="vinyl-widget-tag">now playing</span>
    </div>
